<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rayhan Collection | Uzbek Coats & Hijabs</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: #333; }
        header { background: #2c3e50; color: white; padding: 2rem; text-align: center; }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; text-align: center; }
        footer { background: #f9f9f9; padding: 20px; text-align: center; border-top: 1px solid #eee; margin-top: 40px; }
        .contact-info { color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>Rayhan Collection</h1>
    <p>Authentic Uzbek Craftsmanship & Elegant Hijabs</p>
</header>

<div class="container">
    <h2>Our Collection</h2>
    <div class="product-grid">
        {% for item in products %}
        <div class="card">
            <h3>{{ item.name }}</h3>
            <p>{{ item.description }}</p>
        </div>
        {% endfor %}
    </div>
</div>

<footer>
    <h3>Contact Us</h3>
    <p>Email: <a href="mailto:rayhan.collection@email.com" class="contact-info">rayhan.collection@email.com</a></p>
    
    <p>Instagram: <a href="https://www.instagram.com/Rayhan_Collection" target="_blank" class="contact-info">@Rayhan_Collection</a></p>
</footer>

<style>
    /* Adding a little extra style so the links look nice */
    footer a {
        text-decoration: none;
        color: #e67e22;
        font-weight: bold;
    }
    footer a:hover {
        text-decoration: underline;
    }
</style>

</body>
</html>
